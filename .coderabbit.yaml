knowledge_base:
  code_guidelines:
    filePatterns:
      - "**/SKILL.md"
reviews:
  request_changes_workflow: true
  review_details: true
  fail_commit_status: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    auto_pause_after_reviewed_commits: 1
  pre_merge_checks:
    custom_checks:
      - mode: error
        name: min-level
        instructions: >-
          Fail the status check if you find any SECURITY RELATED major or
          critical issues. Do not fail the status check if there are trivial,
          nitpick, or minor issues, or not related to security.
chat:
  art: false
